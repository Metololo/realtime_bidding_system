syntax = "proto3";

package auctionevents;

option go_package = "github.com/Metololo/realtime_bidding_system/proto;auctionpb";

import "google/protobuf/timestamp.proto";

message AuctionCreatedEvent {
  string                    event_id    = 1;
  google.protobuf.Timestamp occurred_at = 2;

  string auction_id = 3;
  string item_id    = 4;

  int64 reserve_price = 5;

  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp end_at     = 7;
}

enum AuctionOutcome {
  AUCTION_OUTCOME_UNSPECIFIED = 0;
  AUCTION_OUTCOME_SOLD        = 1;
  AUCTION_OUTCOME_NO_BIDS     = 2;
}

message WinnerInfo {
  string bidder_id = 1;
  int64  amount    = 2;
}

message AuctionClosedEvent {
  string                    event_id    = 1;
  google.protobuf.Timestamp occurred_at = 2;

  string auction_id = 3;
  string item_id    = 4;

  AuctionOutcome outcome = 5;

  google.protobuf.Timestamp closed_at = 6;

  WinnerInfo winner = 7;
}