services:
  auction-engine:
    mem_limit: 512m
    cpus: 0.25
    build:
      context: .
      dockerfile: deployment/auction-engine.Dockerfile
    env_file:
      - .env
    ports:
      - "${AUCTION_ENGINE_SELL_PORT}:${AUCTION_ENGINE_SELL_PORT}"

  seller-service:
    mem_limit: 512m
    cpus: 0.25
    build:
      context: .
      dockerfile: deployment/seller-service.Dockerfile
    env_file:
      - .env
    environment:
      AUCTION_ENGINE_URL: "http://auction-engine:${AUCTION_ENGINE_SELL_PORT}"
    depends_on:
      - auction-engine

  nats-server:
    mem_limit: 512m
    cpus: 0.20
    image: nats:alpine
    ports:
      - 4222:4222
      - 8222:8222
